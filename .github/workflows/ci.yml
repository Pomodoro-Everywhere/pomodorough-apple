name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      CORE_COMMIT: "8dc24486b38d87eb2c717e80b4315b31dd6a671d"
      CORE_SHA256: "1e67043a8a652c5f9c6d36b28fe280b4bb5677e0c0279faaccdceb407181face"
      CORE_RELEASE: "v0.1.5"
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      DERIVED_DATA_PATH: /tmp/PomodoroughDerivedData
      IOS_DESTINATION: platform=iOS Simulator,name=iPhone 17
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Check out pinned shared core
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: Pomodoro-Everywhere/pomodorough-core
          ref: ${{ env.CORE_COMMIT }}
          path: .build/pomodorough-core
          persist-credentials: false

      - name: Download and verify canonical shared core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(cat Resources/SharedCore/CORE_COMMIT)" = "$CORE_COMMIT"
          test "$(cat Resources/SharedCore/CORE_SHA256)" = "$CORE_SHA256"
          test "$(git -C .build/pomodorough-core rev-parse HEAD)" = "$CORE_COMMIT"
          git -C .build/pomodorough-core fetch --depth=1 origin \
            "refs/tags/$CORE_RELEASE:refs/tags/$CORE_RELEASE"
          test "$(git -C .build/pomodorough-core rev-list -n 1 "$CORE_RELEASE")" = "$CORE_COMMIT"
          published_dir="$RUNNER_TEMP/published-shared-core"
          mkdir -p "$published_dir"
          gh release download "$CORE_RELEASE" \
            --repo Pomodoro-Everywhere/pomodorough-core \
            --pattern pomodorough_core.wasm \
            --dir "$published_dir"
          published="$published_dir/pomodorough_core.wasm"
          python3 .build/pomodorough-core/scripts/verify_wasm_artifact.py \
            "$published" \
            --sha256 "$CORE_SHA256"
          python3 .build/pomodorough-core/scripts/verify_wasm_artifact.py \
            Resources/SharedCore/pomodorough_core.wasm \
            --sha256 "$CORE_SHA256"
          python3 scripts/verify_shared_core_provenance.py \
            --sha256 "$CORE_SHA256" \
            "$published" \
            Resources/SharedCore/pomodorough_core.wasm

      - name: Check documentation links
        run: python3 scripts/check_docs.py

      - name: Check interface and localization contract
        run: |
          python3 -m unittest discover -s scripts/tests -v
          python3 scripts/check_interface_contract.py

      - name: Check cross-client protocol fixture
        run: python3 scripts/check_protocol_fixture.py

      - name: Check workflow action pins
        run: python3 scripts/check_workflow_pins.py

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Resolve Swift packages
        run: >-
          xcodebuild
          -project Pomodorough.xcodeproj
          -scheme Pomodorough-iOS
          -derivedDataPath "$DERIVED_DATA_PATH"
          -resolvePackageDependencies

      - name: Test iOS
        run: >-
          xcodebuild
          -project Pomodorough.xcodeproj
          -scheme Pomodorough-iOS
          -destination "$IOS_DESTINATION"
          -derivedDataPath "$DERIVED_DATA_PATH"
          CODE_SIGNING_ALLOWED=NO
          SWIFT_SUPPRESS_WARNINGS=NO
          test

      - name: Build iOS
        run: >-
          xcodebuild
          -project Pomodorough.xcodeproj
          -scheme Pomodorough-iOS
          -destination "$IOS_DESTINATION"
          -derivedDataPath "$DERIVED_DATA_PATH"
          CODE_SIGNING_ALLOWED=NO
          SWIFT_SUPPRESS_WARNINGS=NO
          build

      - name: Build macOS
        run: >-
          xcodebuild
          -project Pomodorough.xcodeproj
          -scheme Pomodorough-macOS
          -configuration Debug
          -derivedDataPath "$DERIVED_DATA_PATH"
          CODE_SIGNING_ALLOWED=NO
          SWIFT_SUPPRESS_WARNINGS=NO
          build

      - name: Verify shared core in built applications
        shell: bash
        run: |
          set -euo pipefail
          verified_apps=0
          while IFS= read -r wasm; do
            actual_sha=$(shasum -a 256 "$wasm" | awk '{print $1}')
            test "$actual_sha" = "$CORE_SHA256"
            verified_apps=$((verified_apps + 1))
          done < <(find "$DERIVED_DATA_PATH/Build/Products" -type f -name 'pomodorough_core.wasm' -print)
          test "$verified_apps" -eq 2

      - name: Test macOS
        run: >-
          xcodebuild
          -project Pomodorough.xcodeproj
          -scheme Pomodorough-macOS
          -destination "platform=macOS"
          -derivedDataPath "$DERIVED_DATA_PATH"
          CODE_SIGNING_ALLOWED=NO
          SWIFT_SUPPRESS_WARNINGS=NO
          test

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Review dependency changes
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
