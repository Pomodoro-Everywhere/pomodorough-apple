name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      CORE_COMMIT: "dda034612bd9a8b3d0f56959d9eef888980acc7b"
      CORE_RELEASE_TAG: "v0.6.0"
      CORE_SHA256: "33cb3bc7477a8075a9613e45b309495e44d28f794e6b88362a8073d505309f5a"
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      DERIVED_DATA_PATH: /tmp/PomodoroughDerivedData
      IOS_DESTINATION: platform=iOS Simulator,name=iPhone 17
      IOS_RESULT_BUNDLE: /tmp/PomodoroughTestResults/Pomodorough-iOS.xcresult
      IOS_TEST_DIAGNOSTICS: /tmp/PomodoroughTestResults/diagnostics
      IOS_TEST_LOG: /tmp/PomodoroughTestResults/xcodebuild.log
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Check out pinned shared core
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: Pomodoro-Everywhere/pomodorough-core
          ref: ${{ env.CORE_COMMIT }}
          path: .build/pomodorough-core
          persist-credentials: false

      - name: Rebuild and verify pinned shared core release
        run: |
          test "$(cat Resources/SharedCore/CORE_COMMIT)" = "$CORE_COMMIT"
          test "$(cat Resources/SharedCore/CORE_SHA256)" = "$CORE_SHA256"
          test "$(git -C .build/pomodorough-core rev-parse HEAD)" = "$CORE_COMMIT"
          rustup toolchain install 1.97.1 --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain 1.97.1
          pinned_rustc=$(rustup which --toolchain 1.97.1 rustc)
          (
            cd .build/pomodorough-core
            RUSTC="$pinned_rustc" rustup run 1.97.1 cargo build \
              --release \
              --target wasm32-unknown-unknown \
              --locked
          )
          rebuilt=.build/pomodorough-core/target/wasm32-unknown-unknown/release/pomodorough_core.wasm
          python3 .build/pomodorough-core/scripts/canonicalize_wasm_artifact.py "$rebuilt"
          python3 .build/pomodorough-core/scripts/verify_wasm_artifact.py "$rebuilt"
          canonical_release="$RUNNER_TEMP/pomodorough_core.wasm"
          curl --fail --location --proto '=https' --tlsv1.2 \
            "https://github.com/Pomodoro-Everywhere/pomodorough-core/releases/download/$CORE_RELEASE_TAG/pomodorough_core.wasm" \
            --output "$canonical_release"
          python3 .build/pomodorough-core/scripts/verify_wasm_artifact.py \
            "$canonical_release" \
            --sha256 "$CORE_SHA256"
          python3 scripts/verify_shared_core_provenance.py \
            --sha256 "$CORE_SHA256" \
            "$canonical_release" \
            Resources/SharedCore/pomodorough_core.wasm

      - name: Check documentation links
        run: python3 scripts/check_docs.py

      - name: Check interface and localization contract
        run: |
          python3 -m unittest discover -s scripts/tests -v
          python3 scripts/check_interface_contract.py

      - name: Check cross-client protocol fixture
        run: python3 scripts/check_protocol_fixture.py

      - name: Check workflow action pins
        run: python3 scripts/check_workflow_pins.py

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Resolve Swift packages
        run: >-
          xcodebuild
          -project Pomodorough.xcodeproj
          -scheme Pomodorough-iOS
          -derivedDataPath "$DERIVED_DATA_PATH"
          -resolvePackageDependencies

      - name: Build iOS for testing
        run: >-
          xcodebuild
          -project Pomodorough.xcodeproj
          -scheme Pomodorough-iOS
          -destination "$IOS_DESTINATION"
          -derivedDataPath "$DERIVED_DATA_PATH"
          CODE_SIGNING_ALLOWED=NO
          SWIFT_SUPPRESS_WARNINGS=NO
          build-for-testing

      - name: Test iOS with bounded finalization
        run: >-
          python3 scripts/run_xcode_tests.py
          --idle-timeout 300
          --wall-timeout 1800
          --log-path "$IOS_TEST_LOG"
          --diagnostics-dir "$IOS_TEST_DIAGNOSTICS"
          --completion-marker "Test Suite 'PomodoroughUITests.xctest' passed"
          --
          xcodebuild
          -project Pomodorough.xcodeproj
          -scheme Pomodorough-iOS
          -destination "$IOS_DESTINATION"
          -derivedDataPath "$DERIVED_DATA_PATH"
          -resultBundlePath "$IOS_RESULT_BUNDLE"
          CODE_SIGNING_ALLOWED=NO
          SWIFT_SUPPRESS_WARNINGS=NO
          test-without-building

      - name: Verify iOS result bundle presence
        if: ${{ always() }}
        run: test -d "$IOS_RESULT_BUNDLE"

      - name: Retain iOS test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-test-evidence
          path: |
            ${{ env.IOS_RESULT_BUNDLE }}
            ${{ env.IOS_TEST_LOG }}
            ${{ env.IOS_TEST_DIAGNOSTICS }}
          if-no-files-found: error
          retention-days: 14

      - name: Build iOS
        run: >-
          xcodebuild
          -project Pomodorough.xcodeproj
          -scheme Pomodorough-iOS
          -destination "$IOS_DESTINATION"
          -derivedDataPath "$DERIVED_DATA_PATH"
          CODE_SIGNING_ALLOWED=NO
          SWIFT_SUPPRESS_WARNINGS=NO
          build

      - name: Build macOS
        run: >-
          xcodebuild
          -project Pomodorough.xcodeproj
          -scheme Pomodorough-macOS
          -configuration Debug
          -derivedDataPath "$DERIVED_DATA_PATH"
          CODE_SIGNING_ALLOWED=NO
          SWIFT_SUPPRESS_WARNINGS=NO
          build

      - name: Verify shared core in built applications
        shell: bash
        run: |
          set -euo pipefail
          verified_apps=0
          while IFS= read -r wasm; do
            actual_sha=$(shasum -a 256 "$wasm" | awk '{print $1}')
            test "$actual_sha" = "$CORE_SHA256"
            verified_apps=$((verified_apps + 1))
          done < <(find "$DERIVED_DATA_PATH/Build/Products" -type f -name 'pomodorough_core.wasm' -print)
          test "$verified_apps" -eq 2

      - name: Test macOS
        run: >-
          xcodebuild
          -project Pomodorough.xcodeproj
          -scheme Pomodorough-macOS
          -destination "platform=macOS"
          -derivedDataPath "$DERIVED_DATA_PATH"
          CODE_SIGNING_ALLOWED=NO
          SWIFT_SUPPRESS_WARNINGS=NO
          test

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Review dependency changes
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
