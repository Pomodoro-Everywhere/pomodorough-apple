name: CI
run-name: candidate-${{ inputs.candidate-request || github.run_id }}

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      candidate-request:
        description: Unique hosted candidate execution request
        required: true
        type: string
      expected-sha:
        description: Exact candidate source commit; fail if dispatch branch moved
        required: true
        type: string
      command-sha256:
        description: SHA256 of the invoking candidate adapter argument array
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.candidate-request || github.ref }}
  cancel-in-progress: true

jobs:
  candidate-source:
    name: Validate candidate source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check candidate dispatch inputs
        if: github.event_name == 'workflow_dispatch'
        env:
          CANDIDATE_INPUTS: ${{ toJSON(github.event.inputs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          inputs = json.loads(os.environ["CANDIDATE_INPUTS"])
          assert re.fullmatch(r"[0-9a-f]{32}", inputs["candidate-request"])
          assert re.fullmatch(r"[0-9a-f]{40}", inputs["expected-sha"])
          assert re.fullmatch(r"[0-9a-f]{64}", inputs["command-sha256"])
          assert inputs["expected-sha"] == os.environ["GITHUB_SHA"]
          assert os.environ["GITHUB_RUN_ATTEMPT"] == "1"
          assert os.environ["RUNNER_ENVIRONMENT"] == "github-hosted"
          context = {
              "inputs": inputs,
              "repository": os.environ["GITHUB_REPOSITORY"],
              "source": os.environ["GITHUB_SHA"],
              "ref": os.environ["GITHUB_REF"],
              "workflow_ref": os.environ["GITHUB_WORKFLOW_REF"],
              "workflow_sha": os.environ["GITHUB_WORKFLOW_SHA"],
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "runner_environment": os.environ["RUNNER_ENVIRONMENT"],
          }
          with open("candidate-context.json", "w") as output:
              json.dump(context, output, sort_keys=True)
          PY

      - name: Retain candidate dispatch context
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-context-${{ inputs.candidate-request }}
          path: candidate-context.json
          if-no-files-found: error
          retention-days: 14

  build-and-test:
    needs: candidate-source
    runs-on: macos-26
    timeout-minutes: 90
    env:
      CORE_COMMIT: "ca552f64308de254b6c4f70ce5efa1e1f1f4271a"
      CORE_RELEASE_TAG: "v0.8.0"
      CORE_SHA256: "e7b05b66569ba4e3735b8d935aa0cbdf24f71d17f1c221b84e612e8155f778a8"
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      DERIVED_DATA_PATH: /tmp/PomodoroughDerivedData
      IOS_DESTINATION: platform=iOS Simulator,name=iPhone 17
      IOS_RESULT_BUNDLE: /tmp/PomodoroughTestResults/Pomodorough-iOS.xcresult
      IOS_TEST_DIAGNOSTICS: /tmp/PomodoroughTestResults/diagnostics
      IOS_TEST_LOG: /tmp/PomodoroughTestResults/xcodebuild.log
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Verify checked out source
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Check out pinned shared core
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: Pomodoro-Everywhere/pomodorough-core
          ref: ${{ env.CORE_COMMIT }}
          path: .build/pomodorough-core
          persist-credentials: false

      - name: Verify pinned source and released shared core
        run: |
          test "$(cat Resources/SharedCore/CORE_COMMIT)" = "$CORE_COMMIT"
          test "$(cat Resources/SharedCore/CORE_SHA256)" = "$CORE_SHA256"
          test "$(git -C .build/pomodorough-core rev-parse HEAD)" = "$CORE_COMMIT"
          rustup toolchain install 1.97.1 --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain 1.97.1
          pinned_rustc=$(rustup which --toolchain 1.97.1 rustc)
          (
            cd .build/pomodorough-core
            RUSTC="$pinned_rustc" rustup run 1.97.1 cargo build \
              --release \
              --target wasm32-unknown-unknown \
              --locked
          )
          rebuilt=.build/pomodorough-core/target/wasm32-unknown-unknown/release/pomodorough_core.wasm
          python3 .build/pomodorough-core/scripts/canonicalize_wasm_artifact.py "$rebuilt"
          python3 .build/pomodorough-core/scripts/verify_wasm_artifact.py "$rebuilt"
          python3 .build/pomodorough-core/scripts/verify_wasm_artifact.py \
            Resources/SharedCore/pomodorough_core.wasm \
            --sha256 "$CORE_SHA256"
          released="$RUNNER_TEMP/pomodorough_core.wasm"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            "https://github.com/Pomodoro-Everywhere/pomodorough-core/releases/download/$CORE_RELEASE_TAG/pomodorough_core.wasm" \
            --output "$released"
          python3 .build/pomodorough-core/scripts/verify_wasm_artifact.py \
            "$released" \
            --sha256 "$CORE_SHA256"
          cmp "$released" Resources/SharedCore/pomodorough_core.wasm

      - name: Check documentation links
        run: python3 scripts/check_docs.py

      - name: Check interface and localization contract
        run: |
          python3 -m unittest discover -s scripts/tests -v
          python3 scripts/check_interface_contract.py

      - name: Check cross-client protocol fixture
        run: python3 scripts/check_protocol_fixture.py

      - name: Check workflow action pins
        run: python3 scripts/check_workflow_pins.py

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Regenerate Xcode project and verify idempotence
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          rm -rf Pomodorough.xcodeproj
          xcodegen generate
          git diff --exit-code -- Pomodorough.xcodeproj
          xcodegen generate
          git diff --exit-code -- Pomodorough.xcodeproj
          test -z "$(git ls-files --others --exclude-standard -- Pomodorough.xcodeproj)"

      - name: Resolve Swift packages
        run: >-
          xcodebuild
          -project Pomodorough.xcodeproj
          -scheme Pomodorough-iOS
          -derivedDataPath "$DERIVED_DATA_PATH"
          -resolvePackageDependencies

      - name: Build iOS for testing
        run: >-
          xcodebuild
          -project Pomodorough.xcodeproj
          -scheme Pomodorough-iOS
          -destination "$IOS_DESTINATION"
          -derivedDataPath "$DERIVED_DATA_PATH"
          CODE_SIGNING_ALLOWED=NO
          SWIFT_SUPPRESS_WARNINGS=NO
          build-for-testing

      - name: Test iOS with bounded finalization
        run: >-
          python3 scripts/run_xcode_tests.py
          --idle-timeout 300
          --wall-timeout 1800
          --log-path "$IOS_TEST_LOG"
          --diagnostics-dir "$IOS_TEST_DIAGNOSTICS"
          --completion-marker "Test Suite 'PomodoroughUITests.xctest' passed"
          --
          xcodebuild
          -project Pomodorough.xcodeproj
          -scheme Pomodorough-iOS
          -destination "$IOS_DESTINATION"
          -derivedDataPath "$DERIVED_DATA_PATH"
          -resultBundlePath "$IOS_RESULT_BUNDLE"
          CODE_SIGNING_ALLOWED=NO
          SWIFT_SUPPRESS_WARNINGS=NO
          test-without-building

      - name: Verify iOS result bundle presence
        if: ${{ always() }}
        run: test -d "$IOS_RESULT_BUNDLE"

      - name: Retain iOS test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-test-evidence
          path: |
            ${{ env.IOS_RESULT_BUNDLE }}
            ${{ env.IOS_TEST_LOG }}
            ${{ env.IOS_TEST_DIAGNOSTICS }}
          if-no-files-found: error
          retention-days: 14

      - name: Build iOS
        run: >-
          xcodebuild
          -project Pomodorough.xcodeproj
          -scheme Pomodorough-iOS
          -destination "$IOS_DESTINATION"
          -derivedDataPath "$DERIVED_DATA_PATH"
          CODE_SIGNING_ALLOWED=NO
          SWIFT_SUPPRESS_WARNINGS=NO
          build

      - name: Build macOS
        run: >-
          xcodebuild
          -project Pomodorough.xcodeproj
          -scheme Pomodorough-macOS
          -configuration Debug
          -derivedDataPath "$DERIVED_DATA_PATH"
          CODE_SIGNING_ALLOWED=NO
          SWIFT_SUPPRESS_WARNINGS=NO
          build

      - name: Verify shared core in built applications
        shell: bash
        run: |
          set -euo pipefail
          verified_apps=0
          while IFS= read -r wasm; do
            actual_sha=$(shasum -a 256 "$wasm" | awk '{print $1}')
            test "$actual_sha" = "$CORE_SHA256"
            verified_apps=$((verified_apps + 1))
          done < <(find "$DERIVED_DATA_PATH/Build/Products" -type f -name 'pomodorough_core.wasm' -print)
          test "$verified_apps" -eq 2

      - name: Test macOS
        run: >-
          xcodebuild
          -project Pomodorough.xcodeproj
          -scheme Pomodorough-macOS
          -destination "platform=macOS"
          -derivedDataPath "$DERIVED_DATA_PATH"
          -resultBundlePath /tmp/PomodoroughTestResults/Pomodorough-macOS.xcresult
          CODE_SIGNING_ALLOWED=NO
          SWIFT_SUPPRESS_WARNINGS=NO
          test

      - name: Test standalone persisted state compatibility iOS
        run: >-
          xcodebuild
          -project Pomodorough.xcodeproj
          -scheme PersistedStateCompatibility-iOS
          -destination "$IOS_DESTINATION"
          -derivedDataPath "$DERIVED_DATA_PATH"
          -resultBundlePath /tmp/PomodoroughTestResults/PersistedStateCompatibility-iOS.xcresult
          CODE_SIGNING_ALLOWED=NO
          SWIFT_SUPPRESS_WARNINGS=NO
          test

      - name: Test standalone persisted state compatibility macOS
        run: >-
          xcodebuild
          -project Pomodorough.xcodeproj
          -scheme PersistedStateCompatibility-macOS
          -destination "platform=macOS"
          -derivedDataPath "$DERIVED_DATA_PATH"
          -resultBundlePath /tmp/PomodoroughTestResults/PersistedStateCompatibility-macOS.xcresult
          CODE_SIGNING_ALLOWED=NO
          SWIFT_SUPPRESS_WARNINGS=NO
          test

      - name: Retain full native test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-test-evidence
          path: /tmp/PomodoroughTestResults/
          if-no-files-found: error
          retention-days: 14

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Review dependency changes
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
