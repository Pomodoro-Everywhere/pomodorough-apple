name: CI
run-name: candidate-${{ inputs.candidate-request || github.run_id }}

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      candidate-request:
        description: Unique hosted candidate execution request
        required: true
        type: string
      expected-sha:
        description: Exact candidate source commit; fail if dispatch branch moved
        required: true
        type: string
      command-sha256:
        description: SHA256 of the invoking candidate adapter argument array
        required: true
        type: string

permissions:
  contents: read
  attestations: read

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.candidate-request || github.ref }}
  cancel-in-progress: true

jobs:
  candidate-source:
    name: Validate candidate source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check candidate dispatch inputs
        if: github.event_name == 'workflow_dispatch'
        env:
          CANDIDATE_INPUTS: ${{ toJSON(github.event.inputs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          inputs = json.loads(os.environ["CANDIDATE_INPUTS"])
          assert re.fullmatch(r"[0-9a-f]{32}", inputs["candidate-request"])
          assert re.fullmatch(r"[0-9a-f]{40}", inputs["expected-sha"])
          assert re.fullmatch(r"[0-9a-f]{64}", inputs["command-sha256"])
          assert inputs["expected-sha"] == os.environ["GITHUB_SHA"]
          assert os.environ["GITHUB_RUN_ATTEMPT"] == "1"
          assert os.environ["RUNNER_ENVIRONMENT"] == "github-hosted"
          context = {
              "inputs": inputs,
              "repository": os.environ["GITHUB_REPOSITORY"],
              "source": os.environ["GITHUB_SHA"],
              "ref": os.environ["GITHUB_REF"],
              "workflow_ref": os.environ["GITHUB_WORKFLOW_REF"],
              "workflow_sha": os.environ["GITHUB_WORKFLOW_SHA"],
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "runner_environment": os.environ["RUNNER_ENVIRONMENT"],
          }
          with open("candidate-context.json", "w") as output:
              json.dump(context, output, sort_keys=True)
          PY

      - name: Retain candidate dispatch context
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-context-${{ inputs.candidate-request }}
          path: candidate-context.json
          if-no-files-found: error
          retention-days: 14

  build-and-test:
    needs: candidate-source
    runs-on: macos-26
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      DERIVED_DATA_PATH: /tmp/PomodoroughDerivedData
      IOS_DESTINATION: platform=iOS Simulator,name=iPhone 17
      IOS_RESULT_BUNDLE: /tmp/PomodoroughTestResults/Pomodorough-iOS.xcresult
      IOS_TEST_DIAGNOSTICS: /tmp/PomodoroughTestResults/diagnostics
      IOS_TEST_LOG: /tmp/PomodoroughTestResults/xcodebuild.log
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Verify checked out source
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Resolve latest shared core release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/fetch_shared_core.sh

      - name: Check documentation links
        run: python3 scripts/check_docs.py

      - name: Check interface and localization contract
        run: |
          python3 -m unittest discover -s scripts/tests -v
          python3 scripts/check_interface_contract.py

      - name: Check cross-client protocol fixture
        run: python3 scripts/check_protocol_fixture.py

      - name: Check workflow action pins
        run: python3 scripts/check_workflow_pins.py

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Regenerate Xcode project and verify idempotence
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          python3 - <<'PY'
          import json
          import re
          import shutil
          import stat
          import subprocess
          from pathlib import Path

          project = Path("Pomodorough.xcodeproj")
          lock = project / "project.xcworkspace/xcshareddata/swiftpm/Package.resolved"

          def run(*arguments, capture=False):
              result = subprocess.run(arguments, stdout=subprocess.PIPE if capture else None)
              if result.returncode:
                  raise SystemExit(result.returncode)
              return result.stdout

          def verify_project_types():
              pending = [project]
              while pending:
                  path = pending.pop()
                  mode = path.lstat().st_mode
                  if stat.S_ISDIR(mode):
                      pending.extend(path.iterdir())
                  elif not stat.S_ISREG(mode):
                      raise SystemExit(f"Non-regular Xcode project content: {path}")

          def read_lock():
              try:
                  mode = lock.lstat().st_mode
              except FileNotFoundError:
                  return None
              if not stat.S_ISREG(mode):
                  raise SystemExit("Missing or non-regular Package.resolved")
              return lock.read_bytes()

          def verify_project():
              run("git", "diff", "--exit-code", "HEAD", "--", str(project))
              run("git", "diff", "--cached", "--exit-code", "HEAD", "--", str(project))
              if run("git", "ls-files", "--others", "-z", "--", str(project), capture=True):
                  raise SystemExit("Untracked Xcode project content")

          def valid_lock(document):
              if not isinstance(document, dict) or document.get("version") != 3:
                  return False
              origin = document.get("originHash")
              if not isinstance(origin, str) or not re.fullmatch(r"[0-9a-f]{64}", origin):
                  return False
              pins = document.get("pins")
              if not isinstance(pins, list) or not pins:
                  return False
              for pin in pins:
                  if not isinstance(pin, dict) or not isinstance(pin.get("state"), dict):
                      return False
                  if not all(isinstance(pin.get(field), str) and pin[field] for field in ("identity", "kind", "location")):
                      return False
                  revision = pin["state"].get("revision")
                  if not isinstance(revision, str) or not re.fullmatch(r"[0-9a-f]{40}", revision):
                      return False
              return True

          run("git", "ls-files", "--error-unmatch", "--", str(lock), capture=True)
          verify_project_types()
          preserved_lock = read_lock()
          if preserved_lock is None:
              raise SystemExit("Missing or non-regular Package.resolved")
          try:
              document = json.loads(preserved_lock)
          except (UnicodeDecodeError, json.JSONDecodeError) as error:
              raise SystemExit(f"Malformed Package.resolved: {error}") from error
          if not valid_lock(document):
              raise SystemExit("Malformed Package.resolved pins")
          verify_project()
          for generation in range(2):
              shutil.rmtree(project)
              run("xcodegen", "generate")
              verify_project_types()
              generated_lock = read_lock()
              if generated_lock is not None and generated_lock != preserved_lock:
                  raise SystemExit("XcodeGen changed Package.resolved")
              if generated_lock is None:
                  lock.parent.mkdir(parents=True, exist_ok=True)
                  lock.write_bytes(preserved_lock)
              verify_project()
          PY

      - name: Resolve Swift packages without trusting a broken sandbox
        run: >-
          python3 scripts/resolve_swift_packages.py
          --checkouts-dir "$DERIVED_DATA_PATH/SourcePackages/checkouts"
          --
          xcodebuild
          -project Pomodorough.xcodeproj
          -scheme Pomodorough-iOS
          -derivedDataPath "$DERIVED_DATA_PATH"
          -resolvePackageDependencies

      - name: Build iOS for testing
        run: >-
          xcodebuild
          -project Pomodorough.xcodeproj
          -scheme Pomodorough-iOS
          -destination "$IOS_DESTINATION"
          -derivedDataPath "$DERIVED_DATA_PATH"
          -disableAutomaticPackageResolution
          CODE_SIGNING_ALLOWED=NO
          SWIFT_SUPPRESS_WARNINGS=NO
          build-for-testing

      - name: Test iOS with bounded finalization
        run: >-
          python3 scripts/run_xcode_tests.py
          --idle-timeout 300
          --wall-timeout 1800
          --log-path "$IOS_TEST_LOG"
          --diagnostics-dir "$IOS_TEST_DIAGNOSTICS"
          --completion-marker "Test Suite 'PomodoroughUITests.xctest' passed"
          --
          xcodebuild
          -project Pomodorough.xcodeproj
          -scheme Pomodorough-iOS
          -destination "$IOS_DESTINATION"
          -derivedDataPath "$DERIVED_DATA_PATH"
          -resultBundlePath "$IOS_RESULT_BUNDLE"
          -disableAutomaticPackageResolution
          CODE_SIGNING_ALLOWED=NO
          SWIFT_SUPPRESS_WARNINGS=NO
          test-without-building

      - name: Verify iOS result bundle presence
        if: ${{ always() }}
        run: test -d "$IOS_RESULT_BUNDLE"

      - name: Retain iOS test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-test-evidence
          path: |
            ${{ env.IOS_RESULT_BUNDLE }}
            ${{ env.IOS_TEST_LOG }}
            ${{ env.IOS_TEST_DIAGNOSTICS }}
          if-no-files-found: error
          retention-days: 14

      - name: Build iOS
        run: >-
          xcodebuild
          -project Pomodorough.xcodeproj
          -scheme Pomodorough-iOS
          -destination "$IOS_DESTINATION"
          -derivedDataPath "$DERIVED_DATA_PATH"
          -disableAutomaticPackageResolution
          CODE_SIGNING_ALLOWED=NO
          SWIFT_SUPPRESS_WARNINGS=NO
          build

      - name: Build macOS
        run: >-
          xcodebuild
          -project Pomodorough.xcodeproj
          -scheme Pomodorough-macOS
          -configuration Debug
          -derivedDataPath "$DERIVED_DATA_PATH"
          -disableAutomaticPackageResolution
          CODE_SIGNING_ALLOWED=NO
          SWIFT_SUPPRESS_WARNINGS=NO
          build

      - name: Verify shared core in built applications
        shell: bash
        run: |
          set -euo pipefail
          expected_sha="$(cat Resources/SharedCore/CORE_SHA256)"
          [[ "$expected_sha" =~ ^[0-9a-f]{64}$ ]]
          verified_apps=0
          while IFS= read -r wasm; do
            actual_sha=$(shasum -a 256 "$wasm" | awk '{print $1}')
            test "$actual_sha" = "$expected_sha"
            verified_apps=$((verified_apps + 1))
          done < <(find "$DERIVED_DATA_PATH/Build/Products" -type f -name 'pomodorough_core.wasm' -print)
          test "$verified_apps" -eq 2

      - name: Test macOS
        run: >-
          xcodebuild
          -project Pomodorough.xcodeproj
          -scheme Pomodorough-macOS
          -destination "platform=macOS"
          -derivedDataPath "$DERIVED_DATA_PATH"
          -resultBundlePath /tmp/PomodoroughTestResults/Pomodorough-macOS.xcresult
          -disableAutomaticPackageResolution
          CODE_SIGNING_ALLOWED=NO
          SWIFT_SUPPRESS_WARNINGS=NO
          test

      - name: Test standalone persisted state compatibility iOS
        run: >-
          xcodebuild
          -project Pomodorough.xcodeproj
          -scheme PersistedStateCompatibility-iOS
          -destination "$IOS_DESTINATION"
          -derivedDataPath "$DERIVED_DATA_PATH"
          -resultBundlePath /tmp/PomodoroughTestResults/PersistedStateCompatibility-iOS.xcresult
          -disableAutomaticPackageResolution
          CODE_SIGNING_ALLOWED=NO
          SWIFT_SUPPRESS_WARNINGS=NO
          test

      - name: Test standalone persisted state compatibility macOS
        run: >-
          xcodebuild
          -project Pomodorough.xcodeproj
          -scheme PersistedStateCompatibility-macOS
          -destination "platform=macOS"
          -derivedDataPath "$DERIVED_DATA_PATH"
          -resultBundlePath /tmp/PomodoroughTestResults/PersistedStateCompatibility-macOS.xcresult
          -disableAutomaticPackageResolution
          CODE_SIGNING_ALLOWED=NO
          SWIFT_SUPPRESS_WARNINGS=NO
          test

      - name: Retain full native test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-test-evidence
          path: /tmp/PomodoroughTestResults/
          if-no-files-found: error
          retention-days: 14

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Review dependency changes
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4

  retain-completed-native-log:
    name: Retain completed native job log
    if: github.event_name == 'workflow_dispatch' && needs.build-and-test.result == 'success'
    needs: build-and-test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Verify checked out source
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Capture completed native job log
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CANDIDATE_INPUTS: ${{ toJSON(github.event.inputs) }}
        run: python3 scripts/capture_completed_native_log.py --output "$RUNNER_TEMP/completed-native-log"
      - name: Retain completed native job log
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: completed-native-log-${{ inputs.candidate-request }}
          path: ${{ runner.temp }}/completed-native-log/
          if-no-files-found: error
          retention-days: 14
          overwrite: false
