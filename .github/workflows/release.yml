  package-and-release:
    needs:
      - preflight
      - selftest
      - test-ios
      - test-macos
      - build-ios-simulator
      - build-ios-device
      - build-macos
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Download iOS simulator app
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-ios-simulator-app
          path: ${{ runner.temp }}/build-ios-simulator-app

      - name: Download iOS device app
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-ios-device-app
          path: ${{ runner.temp }}/build-ios-device-app

      - name: Download macOS app
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-macos-app
          path: ${{ runner.temp }}/build-macos-app

      - name: Package simulator and unsigned non-notarized apps
        shell: bash
        run: |
          set -euo pipefail

          ios_simulator_app="$RUNNER_TEMP/build-ios-simulator-app"
          ios_device_app="$RUNNER_TEMP/build-ios-device-app"
          macos_app="$RUNNER_TEMP/build-macos-app"
          ios_simulator_staged_app="$RUNNER_TEMP/Pomodorough-iOS-Simulator/Pomodorough.app"
          ios_device_staging="$RUNNER_TEMP/Pomodorough-iOS-Device"
          ios_device_staged_app="$ios_device_staging/Payload/Pomodorough.app"
          macos_staged_app="$RUNNER_TEMP/Pomodorough-macOS/Pomodorough.app"
          ios_simulator_zip="$RELEASE_DIR/Pomodorough-iOS-Simulator-ad-hoc-signed-non-notarized-${RELEASE_TAG}.zip"
          ios_device_ipa="$RELEASE_DIR/Pomodorough-iOS-unsigned-${RELEASE_TAG}.ipa"
          macos_zip="$RELEASE_DIR/Pomodorough-macOS-unsigned-non-notarized-${RELEASE_TAG}.zip"

          test -d "$ios_simulator_app"
          test -d "$ios_device_app"
          test -d "$macos_app"
          mkdir -p "$(dirname "$ios_simulator_staged_app")" \
            "$(dirname "$ios_device_staged_app")" \
            "$(dirname "$macos_staged_app")"
          ditto "$ios_simulator_app" "$ios_simulator_staged_app"
          ditto "$ios_device_app" "$ios_device_staged_app"
          ditto "$macos_app" "$macos_staged_app"
          codesign --force --deep --sign - "$ios_simulator_staged_app"
          if codesign -dv "$ios_device_staged_app" >/dev/null 2>&1; then
            codesign --remove-signature "$ios_device_staged_app"
          fi
          codesign --remove-signature "$macos_staged_app"

          codesign --verify --deep --strict "$ios_simulator_staged_app"
          if codesign -dv "$ios_device_staged_app" >/dev/null 2>&1; then
            printf 'iOS device artifact is still signed\n' >&2
            exit 1
          fi
          if codesign -dv "$macos_staged_app" >/dev/null 2>&1; then
            printf 'macOS artifact is still signed\n' >&2
            exit 1
          fi

          mkdir -p "$RELEASE_DIR"
          ditto -c -k --sequesterRsrc --keepParent "$ios_simulator_staged_app" "$ios_simulator_zip"
          (
            cd "$ios_device_staging"
            ditto -c -k --sequesterRsrc --keepParent Payload "$ios_device_ipa"
          )
          ditto -c -k --sequesterRsrc --keepParent "$macos_staged_app" "$macos_zip"

          cd "$RELEASE_DIR"
          shasum -a 256 ./*.ipa ./*.zip > SHA256SUMS.txt

      - name: Verify shared core in staged release applications
        shell: bash
        run: |
          set -euo pipefail
          verified_apps=0
          while IFS= read -r wasm; do
            actual_sha=$(shasum -a 256 "$wasm" | awk '{print $1}')
            test "$actual_sha" = "$CORE_SHA256"
            verified_apps=$((verified_apps + 1))
          done < <(find \
            "$RUNNER_TEMP/Pomodorough-iOS-Simulator" \
            "$RUNNER_TEMP/Pomodorough-iOS-Device" \
            "$RUNNER_TEMP/Pomodorough-macOS" \
            -type f -name 'pomodorough_core.wasm' -print)
          test "$verified_apps" -eq 3

      - name: Clean-install and launch packaged iOS simulator app
        shell: bash
        run: |
          set -euo pipefail
          archive="$RELEASE_DIR/Pomodorough-iOS-Simulator-ad-hoc-signed-non-notarized-${RELEASE_TAG}.zip"
          extracted="$RUNNER_TEMP/ios-simulator-release-smoke"
          rm -rf "$extracted"
          mkdir -p "$extracted"
          ditto -x -k "$archive" "$extracted"
          app="$extracted/Pomodorough.app"
          test -d "$app"
          codesign --verify --deep --strict "$app"
          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")"
          device_id="$(xcrun simctl list devices available --json | python3 -c 'import json,sys; data=json.load(sys.stdin)["devices"]; print(next(device["udid"] for runtime in data.values() for device in runtime if device["name"] == "iPhone 17"))')"
          xcrun simctl boot "$device_id" 2>/dev/null || true
          xcrun simctl bootstatus "$device_id" -b
          xcrun simctl uninstall "$device_id" "$bundle_id" 2>/dev/null || true
          xcrun simctl install "$device_id" "$app"
          launch_output="$(xcrun simctl launch "$device_id" "$bundle_id")"
          printf '%s\n' "$launch_output"
          launch_pid="${launch_output##*: }"
          test -n "$launch_pid"
          [[ "$launch_pid" =~ ^[0-9]+$ ]]
          uid="$(id -u)"
          poll_deadline=30
          poll_hit=""
          for attempt in $(seq 1 "$poll_deadline"); do
            if xcrun simctl spawn "$device_id" launchctl print "gui/$uid/$bundle_id" 2>/dev/null | grep -q "state = running"; then
              poll_hit="yes"
              break
            fi
            if [[ "$attempt" -eq "$poll_deadline" ]]; then
              echo "Simulator app $bundle_id did not reach running state within ${poll_deadline}s" >&2
              exit 1
            fi
            sleep 1
          done
          test -n "$poll_hit"
          xcrun simctl terminate "$device_id" "$bundle_id"

      - name: Export SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: ${{ env.RELEASE_DIR }}/pomodorough-apple.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Refresh checksums with SBOM
        shell: bash
        run: |
          set -euo pipefail
          cd "$RELEASE_DIR"
          shasum -a 256 ./*.ipa ./*.zip ./*.spdx.json > SHA256SUMS.txt

      - name: Attest artifact provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            /tmp/PomodoroughRelease/*.ipa
            /tmp/PomodoroughRelease/*.zip
            /tmp/PomodoroughRelease/*.spdx.json
            /tmp/PomodoroughRelease/SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          expected_assets=(
            "Pomodorough-iOS-Simulator-ad-hoc-signed-non-notarized-${RELEASE_TAG}.zip"
            "Pomodorough-iOS-unsigned-${RELEASE_TAG}.ipa"
            "Pomodorough-macOS-unsigned-non-notarized-${RELEASE_TAG}.zip"
            "pomodorough-apple.spdx.json"
          )
          expected_release_assets=("${expected_assets[@]}" "SHA256SUMS.txt")

          verify_release_assets() {
            published_dir="$(mktemp -d "$RUNNER_TEMP/published-release.XXXXXX")"
            gh release download "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --dir "$published_dir"
            printf '%s\n' "${expected_release_assets[@]}" | sort > "$RUNNER_TEMP/expected-assets.txt"
            find "$published_dir" -mindepth 1 -maxdepth 1 -type f -exec basename {} \; | sort > "$RUNNER_TEMP/actual-assets.txt"
            cmp "$RUNNER_TEMP/expected-assets.txt" "$RUNNER_TEMP/actual-assets.txt"
            (
              cd "$published_dir"
              shasum -a 256 -c SHA256SUMS.txt
              printf '%s\n' "${expected_assets[@]}" | sort > expected-manifest-assets.txt
              awk '{print $2}' SHA256SUMS.txt | sed -e 's|^\*||' -e 's|^\./||' | sort > actual-manifest-assets.txt
              cmp expected-manifest-assets.txt actual-manifest-assets.txt
              for asset in "${expected_assets[@]}"; do
                gh attestation verify "$asset" --repo "$GITHUB_REPOSITORY"
              done
              gh attestation verify SHA256SUMS.txt --repo "$GITHUB_REPOSITORY"
            )
          }

          release_state="missing"
          if release_state="$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft \
            --jq 'if .isDraft then "draft" else "published" end' 2>/dev/null)"; then
            if [[ "$release_state" == "published" ]]; then
              verify_release_assets
              echo "Release $RELEASE_TAG is already published"
              exit 0
            fi
          else
            release_state="missing"
          fi

          notes_file="$RUNNER_TEMP/release-notes.md"
          {
            printf '%s\n' \
              'Developer artifacts built without distribution signing credentials or notarization.' \
              '' \
              '- iOS simulator ZIP: ad-hoc signed for clean simulator installation; it cannot be installed on a physical device.' \
              '- iOS IPA: unsigned device build; it must be signed and provisioned before installation.' \
              '- macOS artifact: unsigned and non-notarized; Gatekeeper may block normal launch.' \
              '- SHA256SUMS.txt contains SHA-256 checksums for all artifacts.' \
              ''
            gh api --method POST \
              "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="$RELEASE_TAG" \
              --jq .body
          } > "$notes_file"

          if [[ "$release_state" == "missing" ]]; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --draft \
              --title "Pomodorough $RELEASE_TAG developer artifacts" \
              --notes-file "$notes_file"
          fi
          while IFS= read -r asset; do
            gh release delete-asset "$RELEASE_TAG" "$asset" \
              --repo "$GITHUB_REPOSITORY" \
              --yes
          done < <(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[].name')
          gh release upload "$RELEASE_TAG" "$RELEASE_DIR"/* \
            --repo "$GITHUB_REPOSITORY"
          verify_release_assets
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Pomodorough $RELEASE_TAG developer artifacts" \
            --notes-file "$notes_file" \
            --draft=false
