          -scheme Pomodorough-iOS
          -derivedDataPath "$DERIVED_DATA_PATH"
          -resolvePackageDependencies

      - name: Build iOS simulator app without signing credentials
        run: >-
          xcodebuild
          -project Pomodorough.xcodeproj
          -scheme Pomodorough-iOS
          -configuration Release
          -destination "$IOS_DESTINATION"
          -derivedDataPath "$DERIVED_DATA_PATH"
          -disableAutomaticPackageResolution
          CODE_SIGNING_ALLOWED=NO
          SWIFT_SUPPRESS_WARNINGS=NO
          build

      - name: Verify shared core in built iOS simulator app
        run: >-
          python3 scripts/verify_shared_core_provenance.py --shard ios-simulator
          --product "$DERIVED_DATA_PATH/Build/Products/Release-iphonesimulator/Pomodorough.app"
          --output "$RUNNER_TEMP/core-provenance"

      - name: Upload iOS simulator app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-ios-simulator-app
          path: ${{ env.DERIVED_DATA_PATH }}/Build/Products/Release-iphonesimulator/Pomodorough.app
          if-no-files-found: error
          retention-days: 1

      - name: Upload shared core provenance
