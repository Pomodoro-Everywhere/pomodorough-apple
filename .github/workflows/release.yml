          key: release-deriveddata-build-ios-device-macos-26-xcode-26.6-rust-1.97.1-${{ hashFiles('Pomodorough.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
