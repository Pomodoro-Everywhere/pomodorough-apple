          path: ${{ runner.temp }}/core-provenance
          if-no-files-found: error
          retention-days: 7

  # AP118: mirrors the CI SE job — the deployment target is iOS 18, but
  # test-ios above targets the latest runtime, leaving the
  # borderedProminent fallback and the compact layout untested in releases.
  # Runs the UI bundle on an iPhone SE (2nd generation) iOS 18 simulator in
  # dark appearance (doubling as the AP116 dark-mode evidence).
  test-ios-18-se:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      DERIVED_DATA_PATH: /tmp/PomodoroughReleaseDerivedDataSE18
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve latest shared core release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/fetch_shared_core.sh

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Download iOS 18 simulator runtime
        run: |
          set -euo pipefail
          has_ios18="$(xcrun simctl list runtimes --json | python3 -c '
          import json
          import sys
          runtimes = json.load(sys.stdin)["runtimes"]
          print("yes" if any(
              runtime["name"].startswith("iOS 18.")
              and runtime.get("isAvailable", True)
              for runtime in runtimes
          ) else "")
          ')"
          if [[ -n "$has_ios18" ]]; then
            echo "iOS 18 simulator runtime already installed"
            exit 0
          fi
          # Hosted macos-26 runners ship only the latest runtime, so fetch
          # the newest iOS 18 simulator runtime from Apple on demand (~9 GB).
          # Unavailable build versions fail fast before any download, so walk
          # down the 18.x line until the catalog serves one.
          sudo xcode-select --switch "$DEVELOPER_DIR"
          for build in 18.6 18.5 18.4 18.3 18.2 18.1 18.0; do
            if sudo xcodebuild -downloadPlatform iOS -buildVersion "$build"; then
              echo "Downloaded iOS simulator runtime $build"
              exit 0
            fi
          done
          echo "No iOS 18 simulator runtime available for download" >&2
          exit 1

      - name: Provision iPhone SE iOS 18 simulator
        id: se-sim
        run: |
          set -euo pipefail
          runtime_id="$(xcrun simctl list runtimes --json | python3 -c '
          import json
          import sys
          runtimes = json.load(sys.stdin)["runtimes"]
          ios18 = [
              runtime for runtime in runtimes
              if runtime["name"].startswith("iOS 18.")
              and runtime.get("isAvailable", True)
          ]
          print(sorted(ios18, key=lambda runtime: runtime["version"])[-1]["identifier"] if ios18 else "")
          ')"
          if [[ -z "$runtime_id" ]]; then
            echo "No installed iOS 18 simulator runtime and the on-demand download did not provide one." >&2
            exit 1
          fi
          echo "Using simulator runtime $runtime_id"
          udid="$(xcrun simctl list devices --json | python3 -c '
          import json
          import sys
          devices = json.load(sys.stdin)["devices"]
          for device in devices.get(sys.argv[1], []):
              if device["name"] == "iPhone SE (2nd generation)" and device.get("isAvailable", True):
                  print(device["udid"])
                  break
          ' "$runtime_id")"
          if [[ -z "$udid" ]]; then
            udid="$(xcrun simctl create "Pomodorough-SE-iOS18" "iPhone SE (2nd generation)" "$runtime_id")"
          fi
          xcrun simctl boot "$udid" 2>/dev/null || true
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl ui "$udid" appearance dark
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Cache SwiftPM checkouts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.DERIVED_DATA_PATH }}/SourcePackages/checkouts
          key: release-spm-macos-26-xcode-26.6-rust-1.97.1-${{ hashFiles('Pomodorough.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            release-spm-macos-26-xcode-26.6-rust-1.97.1-

      - name: Resolve Swift packages without trusting a broken sandbox
        run: >-
          python3 scripts/resolve_swift_packages.py
          --checkouts-dir "$DERIVED_DATA_PATH/SourcePackages/checkouts"
          --
          xcodebuild
          -project Pomodorough.xcodeproj
          -scheme Pomodorough-iOS
          -derivedDataPath "$DERIVED_DATA_PATH"
          -resolvePackageDependencies

      - name: Build iOS for testing
        run: >-
          xcodebuild
          -project Pomodorough.xcodeproj
          -scheme Pomodorough-iOS
          -destination "platform=iOS Simulator,id=${{ steps.se-sim.outputs.udid }}"
          -derivedDataPath "$DERIVED_DATA_PATH"
          -disableAutomaticPackageResolution
          CODE_SIGNING_ALLOWED=NO
          SWIFT_SUPPRESS_WARNINGS=NO
          build-for-testing

      - name: Test UI bundle on SE iOS 18
        run: >-
          xcodebuild
          -project Pomodorough.xcodeproj
          -scheme Pomodorough-iOS
          -destination "platform=iOS Simulator,id=${{ steps.se-sim.outputs.udid }}"
          -derivedDataPath "$DERIVED_DATA_PATH"
          -resultBundlePath "$RUNNER_TEMP/Pomodorough-iOS-SE18.xcresult"
          -disableAutomaticPackageResolution
          CODE_SIGNING_ALLOWED=NO
          SWIFT_SUPPRESS_WARNINGS=NO
          -only-testing:PomodoroughUITests
          test-without-building

      - name: Upload SE UI test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: se18-ui-test-evidence
          path: ${{ runner.temp }}/Pomodorough-iOS-SE18.xcresult
          if-no-files-found: error
          retention-days: 7

  build-ios-simulator:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Write Sentry DSN for release telemetry
        shell: bash
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          set -euo pipefail
          if [[ -n "${SENTRY_DSN:-}" ]]; then
            printf '%s' "$SENTRY_DSN" > Supporting/SentryDSN.local
            # SentryDSN.local is never bundled; SentrySetup reads the DSN from
            # Info.plist (SENTRY_DSN = $(SENTRY_DSN) expanded at build time),
            # so export it for the xcodebuild steps below. Absent secret still
            # builds with Sentry disabled.
            printf 'SENTRY_DSN=%s\n' "$SENTRY_DSN" >> "$GITHUB_ENV"
          fi

      - name: Resolve latest shared core release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/fetch_shared_core.sh

      - name: Show Xcode version
        run: xcodebuild -version

      # Cache is performance-only. resolve_swift_packages.py byte-compare and
      # the attestation-verified shared core fetch above still run fail-closed
      # after restore, so a stale cache can only fail loudly, never silently
      # build wrong bits.
      - name: Cache SwiftPM checkouts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.DERIVED_DATA_PATH }}/SourcePackages/checkouts
          key: release-spm-macos-26-xcode-26.6-rust-1.97.1-${{ hashFiles('Pomodorough.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            release-spm-macos-26-xcode-26.6-rust-1.97.1-

      - name: Cache DerivedData build intermediates
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ env.DERIVED_DATA_PATH }}/ModuleCache.noindex
            ${{ env.DERIVED_DATA_PATH }}/Build/Intermediates.noindex
            ${{ env.DERIVED_DATA_PATH }}/SDKStatCaches.noindex
          key: release-deriveddata-build-ios-sim-macos-26-xcode-26.6-rust-1.97.1-${{ hashFiles('Pomodorough.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            release-deriveddata-build-ios-sim-macos-26-xcode-26.6-rust-1.97.1-

      - name: Resolve Swift packages without trusting a broken sandbox
        run: >-
          python3 scripts/resolve_swift_packages.py
