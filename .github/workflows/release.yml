name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to recover
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-release:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      DERIVED_DATA_PATH: /tmp/PomodoroughReleaseDerivedData
      IOS_DESTINATION: platform=iOS Simulator,name=iPhone 17
      RELEASE_DIR: /tmp/PomodoroughRelease
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify manual release source
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}" >/dev/null
          git merge-base --is-ancestor "$RELEASE_TAG" HEAD
          unexpected_changes="$(git diff --name-only "$RELEASE_TAG" HEAD -- . ':(exclude).github/**')"
          if [[ -n "$unexpected_changes" ]]; then
            echo "Manual release source differs from $RELEASE_TAG outside workflow files:" >&2
            printf '%s\n' "$unexpected_changes" >&2
            exit 1
          fi

      - name: Validate tag and version metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          semver_pattern='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          tag_version="${RELEASE_TAG#v}"
          if [[ "$RELEASE_TAG" != v* ]] || [[ ! "$tag_version" =~ $semver_pattern ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH format" >&2
            exit 1
          fi

          marketing_version="$(sed -nE 's/^[[:space:]]*MARKETING_VERSION:[[:space:]]*([^[:space:]]+).*/\1/p' project.yml)"
          build_version="$(sed -nE 's/^[[:space:]]*CURRENT_PROJECT_VERSION:[[:space:]]*([0-9]+).*/\1/p' project.yml)"
          ios_marketing="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Supporting/iOS-Info.plist)"
          ios_build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Supporting/iOS-Info.plist)"
          macos_marketing="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Supporting/macOS-Info.plist)"
          macos_build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Supporting/macOS-Info.plist)"
          pbx_marketing="$(sed -nE 's/^[[:space:]]*MARKETING_VERSION = ([^;]+);/\1/p' Pomodorough.xcodeproj/project.pbxproj | sort -u)"
          pbx_build="$(sed -nE 's/^[[:space:]]*CURRENT_PROJECT_VERSION = ([0-9]+);/\1/p' Pomodorough.xcodeproj/project.pbxproj | sort -u)"
          dollar='$'
          expected_marketing_token="${dollar}(MARKETING_VERSION)"
          expected_build_token="${dollar}(CURRENT_PROJECT_VERSION)"

          if [[ "$ios_marketing" != "$expected_marketing_token" ]] ||
            [[ "$macos_marketing" != "$expected_marketing_token" ]]; then
            echo "App plists must inherit MARKETING_VERSION" >&2
            exit 1
          fi
          if [[ "$ios_build" != "$expected_build_token" ]] ||
            [[ "$macos_build" != "$expected_build_token" ]]; then
            echo "App plists must inherit CURRENT_PROJECT_VERSION" >&2
            exit 1
          fi

          if [[ "$marketing_version" != "$tag_version" ]] || [[ "$pbx_marketing" != "$tag_version" ]]; then
            echo "Tag $RELEASE_TAG does not match source version" >&2
            exit 1
          fi
          if [[ ! "$build_version" =~ ^[1-9][0-9]*$ ]]; then
            echo "CURRENT_PROJECT_VERSION must be a positive integer" >&2
            exit 1
          fi
          if [[ "$pbx_build" != "$build_version" ]]; then
            echo "Build version $build_version does not match source build $pbx_build" >&2
            exit 1
          fi

          release_state="$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft \
            --jq 'if .isDraft then "draft" else "published" end' 2>/dev/null || printf missing)"
          if [[ "$release_state" != "published" ]]; then
            previous_tags=()
            while IFS= read -r candidate; do
              [[ "$candidate" == "$RELEASE_TAG" ]] && continue
              candidate_version="${candidate#v}"
              if [[ ! "$candidate_version" =~ $semver_pattern ]]; then
                echo "Existing release tag $candidate is not strict SemVer" >&2
                exit 1
              fi
              previous_tags+=("$candidate")
            done < <(git tag --list 'v*')
            if (( ${#previous_tags[@]} > 0 )); then
              highest_previous="$(printf '%s\n' "${previous_tags[@]#v}" | sort -V | tail -n 1)"
              highest="$(printf '%s\n' "$highest_previous" "$tag_version" | sort -V | tail -n 1)"
              if [[ "$highest" != "$tag_version" ]] || [[ "$highest_previous" == "$tag_version" ]]; then
                echo "Release $tag_version must exceed existing $highest_previous" >&2
                exit 1
              fi

              maximum_previous_build=0
              maximum_previous_tag=""
              for previous_tag in "${previous_tags[@]}"; do
                previous_project="$(git show "${previous_tag}:project.yml")"
                previous_build="$(sed -nE 's/^[[:space:]]*CURRENT_PROJECT_VERSION:[[:space:]]*([0-9]+).*/\1/p' <<< "$previous_project")"
                if [[ ! "$previous_build" =~ ^[1-9][0-9]*$ ]]; then
                  echo "$previous_tag has invalid CURRENT_PROJECT_VERSION" >&2
                  exit 1
                fi
                if (( 10#$previous_build > maximum_previous_build )); then
                  maximum_previous_build=$((10#$previous_build))
                  maximum_previous_tag="$previous_tag"
                fi
              done
              if (( 10#$build_version <= maximum_previous_build )); then
                echo "Build $build_version must exceed $maximum_previous_build from $maximum_previous_tag" >&2
                exit 1
              fi
            fi
          fi

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Resolve Swift packages
        run: >-
          xcodebuild
          -project Pomodorough.xcodeproj
          -scheme Pomodorough-iOS
          -derivedDataPath "$DERIVED_DATA_PATH"
          -resolvePackageDependencies

      - name: Test iOS
        run: >-
          xcodebuild
          -project Pomodorough.xcodeproj
          -scheme Pomodorough-iOS
          -destination "$IOS_DESTINATION"
          -derivedDataPath "$DERIVED_DATA_PATH"
          CODE_SIGNING_ALLOWED=NO
          test

      - name: Test macOS
        run: >-
          xcodebuild
          -project Pomodorough.xcodeproj
          -scheme Pomodorough-macOS
          -destination "platform=macOS"
          -derivedDataPath "$DERIVED_DATA_PATH"
          CODE_SIGNING_ALLOWED=NO
          test

      - name: Build iOS simulator app without signing credentials
        run: >-
          xcodebuild
          -project Pomodorough.xcodeproj
          -scheme Pomodorough-iOS
          -configuration Release
          -destination "$IOS_DESTINATION"
          -derivedDataPath "$DERIVED_DATA_PATH"
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Build iOS device app without signing credentials
        run: >-
          xcodebuild
          -project Pomodorough.xcodeproj
          -scheme Pomodorough-iOS
          -configuration Release
          -destination "generic/platform=iOS"
          -derivedDataPath "$DERIVED_DATA_PATH"
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Build macOS app without signing credentials
        run: >-
          xcodebuild
          -project Pomodorough.xcodeproj
          -scheme Pomodorough-macOS
          -configuration Release
          -destination "generic/platform=macOS"
          -derivedDataPath "$DERIVED_DATA_PATH"
          ARCHS=arm64
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Package unsigned non-notarized apps
        shell: bash
        run: |
          set -euo pipefail

          ios_simulator_app="$DERIVED_DATA_PATH/Build/Products/Release-iphonesimulator/Pomodorough.app"
          ios_device_app="$DERIVED_DATA_PATH/Build/Products/Release-iphoneos/Pomodorough.app"
          macos_app="$DERIVED_DATA_PATH/Build/Products/Release/Pomodorough.app"
          ios_simulator_staged_app="$RUNNER_TEMP/Pomodorough-iOS-Simulator/Pomodorough.app"
          ios_device_staging="$RUNNER_TEMP/Pomodorough-iOS-Device"
          ios_device_staged_app="$ios_device_staging/Payload/Pomodorough.app"
          macos_staged_app="$RUNNER_TEMP/Pomodorough-macOS/Pomodorough.app"
          ios_simulator_zip="$RELEASE_DIR/Pomodorough-iOS-Simulator-unsigned-non-notarized-${RELEASE_TAG}.zip"
          ios_device_ipa="$RELEASE_DIR/Pomodorough-iOS-unsigned-${RELEASE_TAG}.ipa"
          macos_zip="$RELEASE_DIR/Pomodorough-macOS-unsigned-non-notarized-${RELEASE_TAG}.zip"

          test -d "$ios_simulator_app"
          test -d "$ios_device_app"
          test -d "$macos_app"
          mkdir -p "$(dirname "$ios_simulator_staged_app")" \
            "$(dirname "$ios_device_staged_app")" \
            "$(dirname "$macos_staged_app")"
          ditto "$ios_simulator_app" "$ios_simulator_staged_app"
          ditto "$ios_device_app" "$ios_device_staged_app"
          ditto "$macos_app" "$macos_staged_app"
          codesign --remove-signature "$ios_simulator_staged_app"
          if codesign -dv "$ios_device_staged_app" >/dev/null 2>&1; then
            codesign --remove-signature "$ios_device_staged_app"
          fi
          codesign --remove-signature "$macos_staged_app"

          if codesign -dv "$ios_simulator_staged_app" >/dev/null 2>&1; then
            printf 'iOS simulator artifact is still signed\n' >&2
            exit 1
          fi
          if codesign -dv "$ios_device_staged_app" >/dev/null 2>&1; then
            printf 'iOS device artifact is still signed\n' >&2
            exit 1
          fi
          if codesign -dv "$macos_staged_app" >/dev/null 2>&1; then
            printf 'macOS artifact is still signed\n' >&2
            exit 1
          fi

          mkdir -p "$RELEASE_DIR"
          ditto -c -k --sequesterRsrc --keepParent "$ios_simulator_staged_app" "$ios_simulator_zip"
          (
            cd "$ios_device_staging"
            ditto -c -k --sequesterRsrc --keepParent Payload "$ios_device_ipa"
          )
          ditto -c -k --sequesterRsrc --keepParent "$macos_staged_app" "$macos_zip"

          cd "$RELEASE_DIR"
          shasum -a 256 ./*.ipa ./*.zip > SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          expected_assets=(
            "Pomodorough-iOS-Simulator-unsigned-non-notarized-${RELEASE_TAG}.zip"
            "Pomodorough-iOS-unsigned-${RELEASE_TAG}.ipa"
            "Pomodorough-macOS-unsigned-non-notarized-${RELEASE_TAG}.zip"
          )
          expected_release_assets=("${expected_assets[@]}" "SHA256SUMS.txt")

          verify_release_assets() {
            published_dir="$RUNNER_TEMP/published-release"
            rm -rf "$published_dir"
            mkdir -p "$published_dir"
            gh release download "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --dir "$published_dir"
            printf '%s\n' "${expected_release_assets[@]}" | sort > "$RUNNER_TEMP/expected-assets.txt"
            gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json assets \
              --jq '.assets[].name' | sort > "$RUNNER_TEMP/actual-assets.txt"
            cmp "$RUNNER_TEMP/expected-assets.txt" "$RUNNER_TEMP/actual-assets.txt"
            (
              cd "$published_dir"
              shasum -a 256 -c SHA256SUMS.txt
              printf '%s\n' "${expected_assets[@]}" | sort > expected-manifest-assets.txt
              awk '{print $2}' SHA256SUMS.txt | sed -e 's|^\*||' -e 's|^\./||' | sort > actual-manifest-assets.txt
              cmp expected-manifest-assets.txt actual-manifest-assets.txt
            )
          }

          release_state="missing"
          if release_state="$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft \
            --jq 'if .isDraft then "draft" else "published" end' 2>/dev/null)"; then
            if [[ "$release_state" == "published" ]]; then
              verify_release_assets
              echo "Release $RELEASE_TAG is already published"
              exit 0
            fi
          else
            release_state="missing"
          fi

          notes_file="$RUNNER_TEMP/release-notes.md"
          {
            printf '%s\n' \
              'Unsigned, non-notarized developer artifacts built without signing credentials.' \
              '' \
              '- Linker-generated ad-hoc signatures were removed before packaging.' \
              '- iOS simulator ZIP: unsigned simulator build; it cannot be installed on a physical device.' \
              '- iOS IPA: unsigned device build; it must be signed and provisioned before installation.' \
              '- macOS artifact: unsigned and non-notarized; Gatekeeper may block normal launch.' \
              '- SHA256SUMS.txt contains SHA-256 checksums for all artifacts.' \
              ''
            gh api --method POST \
              "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="$RELEASE_TAG" \
              --jq .body
          } > "$notes_file"

          if [[ "$release_state" == "missing" ]]; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --draft \
              --title "Pomodorough $RELEASE_TAG unsigned artifacts" \
              --notes-file "$notes_file"
          fi
          while IFS= read -r asset; do
            gh release delete-asset "$RELEASE_TAG" "$asset" \
              --repo "$GITHUB_REPOSITORY" \
              --yes
          done < <(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[].name')
          gh release upload "$RELEASE_TAG" "$RELEASE_DIR"/* \
            --repo "$GITHUB_REPOSITORY"
          verify_release_assets
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Pomodorough $RELEASE_TAG unsigned artifacts" \
            --notes-file "$notes_file" \
            --draft=false
