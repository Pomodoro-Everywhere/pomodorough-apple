name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to recover
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  CORE_COMMIT: "fde2eaf42c39cd175e23796b9037999abadef732"
  CORE_RELEASE_TAG: "v0.11.0"
  CORE_SHA256: "162954f2c68dc3f90b663483b7df327d583d97f64d1391b60105febe2383896a"
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
  DERIVED_DATA_PATH: /tmp/PomodoroughReleaseDerivedData
  IOS_DESTINATION: platform=iOS Simulator,name=iPhone 17
  RELEASE_DIR: /tmp/PomodoroughRelease
  RUST_TOOLCHAIN: "1.97.1"
  XCODE_VERSION: "26.6"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out pinned shared core
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: Pomodoro-Everywhere/pomodorough-core
          ref: ${{ env.CORE_COMMIT }}
          path: .build/pomodorough-core
          persist-credentials: false

      - name: Verify pinned source and released shared core
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat Resources/SharedCore/CORE_COMMIT)" = "$CORE_COMMIT"
          test "$(cat Resources/SharedCore/CORE_SHA256)" = "$CORE_SHA256"
          test "$(git -C .build/pomodorough-core rev-parse HEAD)" = "$CORE_COMMIT"
          rustup toolchain install 1.97.1 --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain 1.97.1
          pinned_rustc=$(rustup which --toolchain 1.97.1 rustc)
          (
            cd .build/pomodorough-core
            RUSTC="$pinned_rustc" rustup run 1.97.1 cargo build \
              --release \
              --target wasm32-unknown-unknown \
              --locked
          )
          rebuilt=.build/pomodorough-core/target/wasm32-unknown-unknown/release/pomodorough_core.wasm
          python3 .build/pomodorough-core/scripts/canonicalize_wasm_artifact.py "$rebuilt"
          python3 .build/pomodorough-core/scripts/verify_wasm_artifact.py "$rebuilt"
          python3 .build/pomodorough-core/scripts/verify_wasm_artifact.py \
            Resources/SharedCore/pomodorough_core.wasm \
            --sha256 "$CORE_SHA256"
          released="$RUNNER_TEMP/pomodorough_core.wasm"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --connect-timeout 30 --max-time 90 \
            --retry 3 --retry-delay 5 --retry-max-time 375 --retry-all-errors \
            "https://github.com/Pomodoro-Everywhere/pomodorough-core/releases/download/$CORE_RELEASE_TAG/pomodorough_core.wasm" \
            --output "$released"
          python3 .build/pomodorough-core/scripts/verify_wasm_artifact.py \
            "$released" \
            --sha256 "$CORE_SHA256"
          cmp "$released" Resources/SharedCore/pomodorough_core.wasm

      - name: Check documentation links
        run: python3 scripts/check_docs.py

      - name: Check interface and localization contract
        run: python3 scripts/check_interface_contract.py

      - name: Check cross-client protocol fixture
        run: python3 scripts/check_protocol_fixture.py

      - name: Check workflow action pins
        run: python3 scripts/check_workflow_pins.py

      - name: Verify manual release source
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}" >/dev/null
          git merge-base --is-ancestor "$RELEASE_TAG" HEAD
          unexpected_changes="$(git diff --name-only "$RELEASE_TAG" HEAD -- . ':(exclude).github/**')"
          if [[ -n "$unexpected_changes" ]]; then
            echo "Manual release source differs from $RELEASE_TAG outside workflow files:" >&2
            printf '%s\n' "$unexpected_changes" >&2
            exit 1
          fi

      - name: Validate tag and version metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          semver_pattern='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          tag_version="${RELEASE_TAG#v}"
          if [[ "$RELEASE_TAG" != v* ]] || [[ ! "$tag_version" =~ $semver_pattern ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH format" >&2
            exit 1
          fi

          marketing_version="$(sed -nE 's/^[[:space:]]*MARKETING_VERSION:[[:space:]]*([^[:space:]]+).*/\1/p' project.yml)"
          build_version="$(sed -nE 's/^[[:space:]]*CURRENT_PROJECT_VERSION:[[:space:]]*([0-9]+).*/\1/p' project.yml)"
          ios_marketing="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Supporting/iOS-Info.plist)"
          ios_build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Supporting/iOS-Info.plist)"
          macos_marketing="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Supporting/macOS-Info.plist)"
          macos_build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Supporting/macOS-Info.plist)"
          pbx_marketing="$(sed -nE 's/^[[:space:]]*MARKETING_VERSION = ([^;]+);/\1/p' Pomodorough.xcodeproj/project.pbxproj | sort -u)"
          pbx_build="$(sed -nE 's/^[[:space:]]*CURRENT_PROJECT_VERSION = ([0-9]+);/\1/p' Pomodorough.xcodeproj/project.pbxproj | sort -u)"
          dollar='$'
          expected_marketing_token="${dollar}(MARKETING_VERSION)"
          expected_build_token="${dollar}(CURRENT_PROJECT_VERSION)"

          if [[ "$ios_marketing" != "$expected_marketing_token" ]] ||
            [[ "$macos_marketing" != "$expected_marketing_token" ]]; then
            echo "App plists must inherit MARKETING_VERSION" >&2
            exit 1
          fi
          if [[ "$ios_build" != "$expected_build_token" ]] ||
            [[ "$macos_build" != "$expected_build_token" ]]; then
            echo "App plists must inherit CURRENT_PROJECT_VERSION" >&2
            exit 1
          fi

          if [[ "$marketing_version" != "$tag_version" ]] || [[ "$pbx_marketing" != "$tag_version" ]]; then
            echo "Tag $RELEASE_TAG does not match source version" >&2
            exit 1
          fi
          if [[ ! "$build_version" =~ ^[1-9][0-9]*$ ]]; then
            echo "CURRENT_PROJECT_VERSION must be a positive integer" >&2
            exit 1
          fi
          if [[ "$pbx_build" != "$build_version" ]]; then
            echo "Build version $build_version does not match source build $pbx_build" >&2
            exit 1
          fi

          release_state="$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft \
            --jq 'if .isDraft then "draft" else "published" end' 2>/dev/null || printf missing)"
          if [[ "$release_state" != "published" ]]; then
            previous_tags=()
            while IFS= read -r candidate; do
              [[ "$candidate" == "$RELEASE_TAG" ]] && continue
              candidate_version="${candidate#v}"
              if [[ ! "$candidate_version" =~ $semver_pattern ]]; then
                echo "Existing release tag $candidate is not strict SemVer" >&2
                exit 1
              fi
              previous_tags+=("$candidate")
            done < <(git tag --list 'v*')
            if (( ${#previous_tags[@]} > 0 )); then
              highest_previous="$(printf '%s\n' "${previous_tags[@]#v}" | sort -V | tail -n 1)"
              highest="$(printf '%s\n' "$highest_previous" "$tag_version" | sort -V | tail -n 1)"
              if [[ "$highest" != "$tag_version" ]] || [[ "$highest_previous" == "$tag_version" ]]; then
                echo "Release $tag_version must exceed existing $highest_previous" >&2
                exit 1
              fi

              maximum_previous_build=0
              maximum_previous_tag=""
              for previous_tag in "${previous_tags[@]}"; do
                previous_project="$(git show "${previous_tag}:project.yml")"
                previous_build="$(sed -nE 's/^[[:space:]]*CURRENT_PROJECT_VERSION:[[:space:]]*([0-9]+).*/\1/p' <<< "$previous_project")"
                if [[ ! "$previous_build" =~ ^[1-9][0-9]*$ ]]; then
                  echo "$previous_tag has invalid CURRENT_PROJECT_VERSION" >&2
                  exit 1
                fi
                if (( 10#$previous_build > maximum_previous_build )); then
                  maximum_previous_build=$((10#$previous_build))
                  maximum_previous_tag="$previous_tag"
                fi
              done
              if (( 10#$build_version <= maximum_previous_build )); then
                echo "Build $build_version must exceed $maximum_previous_build from $maximum_previous_tag" >&2
                exit 1
              fi
            fi
          fi

      - name: Show Xcode version
        run: xcodebuild -version

  selftest:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run scripts self-test bundle
        run: python3 -m unittest discover -s scripts/tests -v

  test-ios:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Write Sentry DSN for release telemetry
        shell: bash
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          set -euo pipefail
          if [[ -n "${SENTRY_DSN:-}" ]]; then
            printf '%s' "$SENTRY_DSN" > Supporting/SentryDSN.local
            # SentryDSN.local is never bundled; SentrySetup reads the DSN from
            # Info.plist (SENTRY_DSN = $(SENTRY_DSN) expanded at build time),
            # so export it for the xcodebuild steps below. Absent secret still
            # builds with Sentry disabled.
            printf 'SENTRY_DSN=%s\n' "$SENTRY_DSN" >> "$GITHUB_ENV"
          fi

      - name: Check out pinned shared core
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: Pomodoro-Everywhere/pomodorough-core
          ref: ${{ env.CORE_COMMIT }}
          path: .build/pomodorough-core
          persist-credentials: false

      - name: Verify pinned source and released shared core
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat Resources/SharedCore/CORE_COMMIT)" = "$CORE_COMMIT"
          test "$(cat Resources/SharedCore/CORE_SHA256)" = "$CORE_SHA256"
          test "$(git -C .build/pomodorough-core rev-parse HEAD)" = "$CORE_COMMIT"
          rustup toolchain install 1.97.1 --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain 1.97.1
          pinned_rustc=$(rustup which --toolchain 1.97.1 rustc)
          (
            cd .build/pomodorough-core
            RUSTC="$pinned_rustc" rustup run 1.97.1 cargo build \
              --release \
              --target wasm32-unknown-unknown \
              --locked
          )
          rebuilt=.build/pomodorough-core/target/wasm32-unknown-unknown/release/pomodorough_core.wasm
          python3 .build/pomodorough-core/scripts/canonicalize_wasm_artifact.py "$rebuilt"
          python3 .build/pomodorough-core/scripts/verify_wasm_artifact.py "$rebuilt"
          python3 .build/pomodorough-core/scripts/verify_wasm_artifact.py \
            Resources/SharedCore/pomodorough_core.wasm \
            --sha256 "$CORE_SHA256"
          released="$RUNNER_TEMP/pomodorough_core.wasm"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --connect-timeout 30 --max-time 90 \
            --retry 3 --retry-delay 5 --retry-max-time 375 --retry-all-errors \
            "https://github.com/Pomodoro-Everywhere/pomodorough-core/releases/download/$CORE_RELEASE_TAG/pomodorough_core.wasm" \
            --output "$released"
          python3 .build/pomodorough-core/scripts/verify_wasm_artifact.py \
            "$released" \
            --sha256 "$CORE_SHA256"
          cmp "$released" Resources/SharedCore/pomodorough_core.wasm

      - name: Show Xcode version
        run: xcodebuild -version

      # Cache is performance-only. resolve_swift_packages.py byte-compare and
      # the wasm sha verifiers above still run fail-closed after restore, so a
      # stale cache can only fail loudly, never silently build wrong bits.
      - name: Cache Rust toolchain and cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup/toolchains
            .build/pomodorough-core/target
          key: release-rust-macos-26-xcode-26.6-rust-1.97.1-${{ hashFiles('Pomodorough.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            release-rust-macos-26-xcode-26.6-rust-1.97.1-

      - name: Cache SwiftPM checkouts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.DERIVED_DATA_PATH }}/SourcePackages/checkouts
          key: release-spm-macos-26-xcode-26.6-rust-1.97.1-${{ hashFiles('Pomodorough.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            release-spm-macos-26-xcode-26.6-rust-1.97.1-

      - name: Cache DerivedData build intermediates
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ env.DERIVED_DATA_PATH }}/ModuleCache.noindex
            ${{ env.DERIVED_DATA_PATH }}/Build/Intermediates.noindex
            ${{ env.DERIVED_DATA_PATH }}/SDKStatCaches.noindex
          key: release-deriveddata-test-ios-macos-26-xcode-26.6-rust-1.97.1-${{ hashFiles('Pomodorough.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            release-deriveddata-test-ios-macos-26-xcode-26.6-rust-1.97.1-

      - name: Resolve Swift packages without trusting a broken sandbox
        run: >-
          python3 scripts/resolve_swift_packages.py
          --checkouts-dir "$DERIVED_DATA_PATH/SourcePackages/checkouts"
          --
          xcodebuild
          -project Pomodorough.xcodeproj
          -scheme Pomodorough-iOS
          -derivedDataPath "$DERIVED_DATA_PATH"
          -resolvePackageDependencies

      - name: Test iOS
        run: >-
          xcodebuild
          -project Pomodorough.xcodeproj
          -scheme Pomodorough-iOS
          -destination "$IOS_DESTINATION"
          -derivedDataPath "$DERIVED_DATA_PATH"
          -disableAutomaticPackageResolution
          CODE_SIGNING_ALLOWED=NO
          SWIFT_SUPPRESS_WARNINGS=NO
          test

