name: Pomodorough
options:
  bundleIdPrefix: me.egigoka
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS.git
    from: 9.2.0
  IrohLib:
    url: https://github.com/n0-computer/iroh-ffi
    exactVersion: 1.1.0
  WasmKit:
    url: https://github.com/swiftwasm/WasmKit.git
    exactVersion: 0.3.1
schemes:
  Pomodorough-iOS:
    build:
      targets:
        Pomodorough-iOS: all
    test:
      targets:
        - PomodoroughTests
        - PomodoroughUITests
  Pomodorough-macOS:
    build:
      targets:
        Pomodorough-macOS: all
    test:
      targets:
        - PomodoroughMacTests
  PersistedStateCompatibility-iOS:
    build:
      targets:
        Pomodorough-iOS: all
    test:
      targets:
        - PersistedStateCompatibilityTests
  PersistedStateCompatibility-macOS:
    build:
      targets:
        Pomodorough-macOS: all
    test:
      targets:
        - PersistedStateCompatibilityMacTests
settings:
  base:
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: 0.8.0
    CURRENT_PROJECT_VERSION: 21
    GOOGLE_CLIENT_ID: "614768274539-7pql3pdu31c8fctsp5ekdc3v2ej8isnr.apps.googleusercontent.com"
    GOOGLE_REVERSED_CLIENT_ID: "com.googleusercontent.apps.614768274539-7pql3pdu31c8fctsp5ekdc3v2ej8isnr"
targets:
  Pomodorough-iOS:
    type: application
    platform: iOS
    productName: Pomodorough
    sources:
      - path: Sources
      - path: Resources
        excludes: [SharedCore]
        buildPhase: resources
      - path: Resources/SharedCore/pomodorough_core.wasm
        buildPhase: resources
    info:
      path: Supporting/iOS-Info.plist
      properties:
        CFBundleDisplayName: Pomodorough
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        GIDClientID: $(GOOGLE_CLIENT_ID)
        NSAlarmKitUsageDescription: Pomodorough schedules alarms so completed focus sessions and breaks alert you even when the app is not open.
        NSLocalNetworkUsageDescription: Pomodorough uses your local network to connect directly to trusted Iroh room peers.
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - $(GOOGLE_REVERSED_CLIENT_ID)
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
      - package: IrohLib
        product: IrohLib
      - package: WasmKit
        product: WasmKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.egigoka.pomodorough
        PRODUCT_NAME: Pomodorough
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: PTT6GCQ699
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  Pomodorough-macOS:
    type: application
    platform: macOS
    productName: Pomodorough
    sources:
      - path: Sources
      - path: Resources
        excludes: [SharedCore]
        buildPhase: resources
      - path: Resources/SharedCore/pomodorough_core.wasm
        buildPhase: resources
    info:
      path: Supporting/macOS-Info.plist
      properties:
        CFBundleDisplayName: Pomodorough
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        GIDClientID: $(GOOGLE_CLIENT_ID)
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - $(GOOGLE_REVERSED_CLIENT_ID)
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
      - package: IrohLib
        product: IrohLib
      - package: WasmKit
        product: WasmKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.egigoka.pomodorough.mac
        PRODUCT_NAME: Pomodorough
        ARCHS: arm64
        CODE_SIGN_ENTITLEMENTS: Pomodorough-macOS.entitlements
        DEVELOPMENT_TEAM: PTT6GCQ699
        CODE_SIGN_STYLE: Automatic
  PomodoroughTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Pomodorough-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.egigoka.pomodorough.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Pomodorough.app/Pomodorough
        BUNDLE_LOADER: $(TEST_HOST)
  PomodoroughUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
        excludes: [Fixtures]
      - path: UITests/Fixtures
        buildPhase: resources
    dependencies:
      - target: Pomodorough-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.egigoka.pomodorough.ui-tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Pomodorough-iOS
  PomodoroughMacTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests]
    dependencies:
      - target: Pomodorough-macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.egigoka.pomodorough.mac.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Pomodorough.app/Contents/MacOS/Pomodorough
        BUNDLE_LOADER: $(TEST_HOST)
  PersistedStateCompatibilityTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/PersistedStateDecouplingCompatibilityTests.swift, Tests/Compatibility/LegacyPendingOperationRebase.swift]
    dependencies:
      - target: Pomodorough-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.egigoka.pomodorough.persisted-state-compatibility.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Pomodorough.app/Pomodorough
        BUNDLE_LOADER: $(TEST_HOST)
  PersistedStateCompatibilityMacTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/PersistedStateDecouplingCompatibilityTests.swift, Tests/Compatibility/LegacyPendingOperationRebase.swift]
    dependencies:
      - target: Pomodorough-macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.egigoka.pomodorough.mac.persisted-state-compatibility.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Pomodorough.app/Contents/MacOS/Pomodorough
        BUNDLE_LOADER: $(TEST_HOST)
