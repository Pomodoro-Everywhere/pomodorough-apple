name: Pomodorough
options:
  bundleIdPrefix: me.egigoka
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
    watchOS: "11.0"
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS.git
    from: 9.2.0
  IrohLib:
    url: https://github.com/n0-computer/iroh-ffi
    exactVersion: 1.1.0
  WasmKit:
    url: https://github.com/swiftwasm/WasmKit.git
    exactVersion: 0.3.1
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa.git
    exactVersion: 9.27.0
schemes:
  Pomodorough-iOS:
    build:
      targets:
        Pomodorough-iOS: all
    test:
      environmentVariables:
        POMODOROUGH_SILENCE_AUDIO: "1"
      targets:
        - PomodoroughTests
        - PomodoroughUITests
  Pomodorough-macOS:
    build:
      targets:
        # Hosted macOS tests run in PomodoroughMacTestHost, never in the
        # real app (macOS host isolation, M1). Both targets share the
        # Pomodorough module name, so one build never contains both.
        Pomodorough-macOS: [run, profile, analyze, archive]
        PomodoroughMacTestHost: [test]
    test:
      environmentVariables:
        POMODOROUGH_SILENCE_AUDIO: "1"
      targets:
        - PomodoroughMacTests
  Pomodorough-watchOS:
    build:
      targets:
        Pomodorough-watchOS: all
  PersistedStateCompatibility-iOS:
    build:
      targets:
        Pomodorough-iOS: all
    test:
      environmentVariables:
        POMODOROUGH_SILENCE_AUDIO: "1"
      targets:
        - PersistedStateCompatibilityTests
  PersistedStateCompatibility-macOS:
    build:
      targets:
        # Hosted macOS tests run in PomodoroughMacTestHost, never in the
        # real app (macOS host isolation, M1). Both targets share the
        # Pomodorough module name, so one build never contains both.
        Pomodorough-macOS: [run, profile, analyze, archive]
        PomodoroughMacTestHost: [test]
    test:
      environmentVariables:
        POMODOROUGH_SILENCE_AUDIO: "1"
      targets:
        - PersistedStateCompatibilityMacTests
settings:
  base:
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: 0.56.0
    CURRENT_PROJECT_VERSION: 64
    GOOGLE_CLIENT_ID: "614768274539-7pql3pdu31c8fctsp5ekdc3v2ej8isnr.apps.googleusercontent.com"
    GOOGLE_REVERSED_CLIENT_ID: "com.googleusercontent.apps.614768274539-7pql3pdu31c8fctsp5ekdc3v2ej8isnr"
targetTemplates:
  # Shared by the macOS app and its test host, so the two cannot drift.
  PomodoroughMacApp:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
        excludes: [SharedCore]
        buildPhase: resources
      - path: Resources/SharedCore/pomodorough_core.wasm
        buildPhase: resources
      - path: Resources/SharedCore/CORE_RELEASE_TAG
        buildPhase: resources
      - path: Resources/SharedCore/CORE_COMMIT
        buildPhase: resources
      - path: Resources/SharedCore/CORE_SHA256
        buildPhase: resources
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
      - package: IrohLib
        product: IrohLib
      - package: WasmKit
        product: WasmKit
      - package: Sentry
        product: Sentry
targets:
  Pomodorough-iOS:
    type: application
    platform: iOS
    productName: Pomodorough
    sources:
      - path: Sources
      - path: Shared
      - path: Resources
        excludes: [SharedCore]
        buildPhase: resources
      - path: Resources/SharedCore/pomodorough_core.wasm
        buildPhase: resources
      - path: Resources/SharedCore/CORE_RELEASE_TAG
        buildPhase: resources
      - path: Resources/SharedCore/CORE_COMMIT
        buildPhase: resources
      - path: Resources/SharedCore/CORE_SHA256
        buildPhase: resources
    info:
      path: Supporting/iOS-Info.plist
      properties:
        CFBundleDisplayName: Pomodorough
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        GIDClientID: $(GOOGLE_CLIENT_ID)
        SENTRY_DSN: $(SENTRY_DSN)
        NSAlarmKitUsageDescription: Pomodorough schedules alarms so completed focus sessions and breaks alert you even when the app is not open.
        NSSupportsLiveActivities: true
        NSLocalNetworkUsageDescription: Pomodorough uses your local network to connect directly to trusted Iroh room peers.
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - pomodorough
          - CFBundleURLSchemes:
              - $(GOOGLE_REVERSED_CLIENT_ID)
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    dependencies:
      - target: Pomodorough-watchOS
      - target: PomodoroughLiveActivity
        embed: true
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
      - package: IrohLib
        product: IrohLib
      - package: WasmKit
        product: WasmKit
      - package: Sentry
        product: Sentry
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.egigoka.pomodorough
        CODE_SIGN_ENTITLEMENTS: Supporting/TimerWidget.entitlements
        PRODUCT_NAME: Pomodorough
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: PTT6GCQ699
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  PomodoroughLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: Shared
      - path: LiveActivity
    info:
      path: Supporting/LiveActivity-Info.plist
      properties:
        CFBundleDisplayName: Pomodorough Timer
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.egigoka.pomodorough.liveactivity
        CODE_SIGN_ENTITLEMENTS: Supporting/TimerWidget.entitlements
        DEVELOPMENT_TEAM: PTT6GCQ699
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
  Pomodorough-macOS:
    templates: [PomodoroughMacApp]
    productName: Pomodorough
    info:
      path: Supporting/macOS-Info.plist
      properties:
        CFBundleDisplayName: Pomodorough
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        GIDClientID: $(GOOGLE_CLIENT_ID)
        SENTRY_DSN: $(SENTRY_DSN)
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - $(GOOGLE_REVERSED_CLIENT_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.egigoka.pomodorough.mac
        PRODUCT_NAME: Pomodorough
        ARCHS: arm64
        CODE_SIGN_ENTITLEMENTS: Pomodorough-macOS.entitlements
        DEVELOPMENT_TEAM: PTT6GCQ699
        CODE_SIGN_STYLE: Automatic
  # Host of the hosted macOS unit tests (macOS host isolation, M1). AppKit
  # keeps window frames, the status item position, saved state, caches and
  # cookies under the bundle identifier, so its own identifier keeps them
  # out of the real app's domain. DefaultStorageLocation stops any other
  # host. Signed to run locally only, so it needs no App ID.
  PomodoroughMacTestHost:
    templates: [PomodoroughMacApp]
    productName: PomodoroughTestHost
    info:
      path: Supporting/macOS-TestHost-Info.plist
      properties:
        CFBundleDisplayName: Pomodorough Test Host
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        GIDClientID: $(GOOGLE_CLIENT_ID)
        SENTRY_DSN: $(SENTRY_DSN)
        LSUIElement: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.egigoka.pomodorough.mac.testhost
        # DEBUG only: DefaultStorageLocation fails to compile in Release
        # with this flag, and stops a standalone launch of the host.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) POMODOROUGH_MAC_TEST_HOST"
        PRODUCT_NAME: PomodoroughTestHost
        PRODUCT_MODULE_NAME: Pomodorough
        ARCHS: arm64
        CODE_SIGN_ENTITLEMENTS: Pomodorough-macOS.entitlements
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        SKIP_INSTALL: YES
  Pomodorough-watchOS:
    type: application
    platform: watchOS
    productName: Pomodorough
    deploymentTarget: "11.0"
    sources:
      - path: Watch
      - path: Sources/WatchSyncPayload.swift
    resources:
      - path: Resources/WatchAssets.xcassets
    info:
      path: Supporting/Watch-Info.plist
      properties:
        CFBundleDisplayName: Pomodorough
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKRunsIndependentlyOfCompanionApp: true
        WKCompanionAppBundleIdentifier: me.egigoka.pomodorough
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.egigoka.pomodorough.watch
        PRODUCT_NAME: Pomodorough
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: PTT6GCQ699
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: NO
  PomodoroughTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    info:
      path: Supporting/Tests-iOS-Info.plist
      properties:
        # R54-APB02: installs the Keychain guard reporter before any test runs.
        NSPrincipalClass: PomodoroughKeychainIsolationPrincipal
    dependencies:
      - target: Pomodorough-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.egigoka.pomodorough.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Pomodorough.app/Pomodorough
        BUNDLE_LOADER: $(TEST_HOST)
  PomodoroughUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
        excludes: [Fixtures]
      - path: UITests/Fixtures
        buildPhase: resources
    dependencies:
      - target: Pomodorough-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.egigoka.pomodorough.ui-tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Pomodorough-iOS
  PomodoroughMacTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests]
    info:
      path: Supporting/Tests-macOS-Info.plist
      properties:
        # R54-APB02: installs the Keychain guard reporter before any test runs.
        NSPrincipalClass: PomodoroughKeychainIsolationPrincipal
    dependencies:
      - target: PomodoroughMacTestHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.egigoka.pomodorough.mac.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/PomodoroughTestHost.app/Contents/MacOS/PomodoroughTestHost
        BUNDLE_LOADER: $(TEST_HOST)
  PersistedStateCompatibilityTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/PersistedStateDecouplingCompatibilityTests.swift, Tests/Compatibility/LegacyPendingOperationRebase.swift]
    dependencies:
      - target: Pomodorough-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.egigoka.pomodorough.persisted-state-compatibility.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Pomodorough.app/Pomodorough
        BUNDLE_LOADER: $(TEST_HOST)
  PersistedStateCompatibilityMacTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/PersistedStateDecouplingCompatibilityTests.swift, Tests/Compatibility/LegacyPendingOperationRebase.swift]
    dependencies:
      - target: PomodoroughMacTestHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.egigoka.pomodorough.mac.persisted-state-compatibility.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/PomodoroughTestHost.app/Contents/MacOS/PomodoroughTestHost
        BUNDLE_LOADER: $(TEST_HOST)
